name: FIXIT Web CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, test safety and build static web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stable npm
        run: npm install -g npm@11.6.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test PowerShell allowlist and JSON validation
        run: npm test
      - name: TypeScript check and Vite production build
        run: npm run build
