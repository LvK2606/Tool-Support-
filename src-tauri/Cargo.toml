[package]
name = "fixit-commander"
version = "0.1.0"
description = "FIXIT Commander local Windows diagnostics"
authors = ["FIXIT Commander contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fixit_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
wait-timeout = "0.2"
